<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081c3a">
  <title>World 2000</title>
  <style>
    * { box-sizing: border-box; }
    html { height: 100%; background: #081c3a; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #081c3a;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px;
    }
    h1 {
      margin: 0;
      font-size: clamp(40px, 9vw, 128px);
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      letter-spacing: -0.03em;
    }
    .version {
      position: fixed;
      right: 24px;
      bottom: 20px;
      right: max(24px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      margin: 0;
      color: #b6c7df;
      font-size: clamp(14px, 1.5vw, 20px);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <h1>World 2000</h1>
  </main>
  <p class="version" aria-label="Version 0.0.1">v0.0.1</p>
</body>
</html>
