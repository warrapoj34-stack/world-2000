<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1725">
  <meta name="description" content="World 2000 — บริหารประเทศ กำหนดอนาคตของโลก">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/main.css">
  <script type="module" src="./js/main.js"></script>
  <title>World 2000</title>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="./" aria-label="World 2000 หน้าหลัก"><span class="brand-mark" aria-hidden="true">W</span><span>WORLD 2000</span></a>
    <span class="era"><span class="status-dot" aria-hidden="true"></span> จุดเริ่มต้นแห่งสหัสวรรษใหม่</span>
  </header>
  <main class="main-menu">
    <section class="menu-content" aria-labelledby="game-title">
      <p class="eyebrow">โลกหนึ่งใบ • อนาคตในมือคุณ</p>
      <h1 id="game-title">WORLD<span>2000<span class="title-dot">.</span></span></h1>
      <p class="intro">หนึ่งประเทศ ล้านความเป็นไปได้<br>กำหนดเส้นทางของคุณบนเวทีโลก</p>
      <div class="menu-actions" aria-describedby="menu-note">
        <button class="menu-button primary" type="button" disabled><span>เริ่มเกมใหม่</span><span aria-hidden="true">↗</span></button>
        <button class="menu-button secondary" type="button" disabled><span>เล่นต่อ</span><span aria-hidden="true">→</span></button>
      </div>
      <p id="menu-note" class="menu-note">อยู่ระหว่างการพัฒนา • ยังไม่เปิดให้เล่น</p>
    </section>
    <div class="world-art" aria-hidden="true">
      <div class="coordinate top-coordinate">ค.ศ. <strong>2000</strong></div>
      <svg class="globe" viewBox="0 0 600 600" fill="none">
        <defs>
          <radialGradient id="ocean"><stop stop-color="#1b3e4c"/><stop offset="1" stop-color="#0c202f"/></radialGradient>
          <clipPath id="sphere"><circle cx="300" cy="300" r="225"/></clipPath>
        </defs>
        <circle class="orbit" cx="300" cy="300" r="282" stroke-dasharray="2 12"/>
        <circle class="orbit" cx="300" cy="300" r="259"/>
        <path class="crosshair" d="M300 0v60m0 480v60M0 300h60m480 0h60"/>
        <circle cx="300" cy="300" r="225" fill="url(#ocean)" stroke="#4c797e"/>
        <g clip-path="url(#sphere)" class="globe-grid">
          <ellipse cx="300" cy="300" rx="155" ry="225"/><ellipse cx="300" cy="300" rx="60" ry="225"/>
          <ellipse cx="300" cy="300" rx="225" ry="150"/><ellipse cx="300" cy="300" rx="225" ry="65"/>
          <path d="M75 300h450M300 75v450"/>
        </g>
        <g class="land" clip-path="url(#sphere)">
          <path d="m115 175 39-30 32 8 21 25 40 9 15 27-17 24-29-3-16 25-25-4-15-31-31-9-14-41Zm91 96 29 3 23 25 35 15 7 31-24 31-12 43-22 31-12-36 1-35-21-23-8-39Z"/>
          <path d="m280 168 22-22 32 7 21-16 37 5 20-18 56 29 41 37-9 37-26 10-23-11-17 23-34-8-15 23-29-12-23-31-28 8-20-22-21-4Zm29 74 38 7 29 35-7 35-22 25-13 34-22-14-8-38-24-26 7-38Zm94 31 22 12 10 38-16-10-16-40Zm43 105 35-14 33 18 11 31-31 16-46-16Z"/>
        </g>
        <g class="map-points"><circle cx="342" cy="209" r="5"/><circle cx="198" cy="216" r="5"/><circle cx="423" cy="292" r="5"/></g>
        <path class="route" d="M198 216Q270 125 342 209T423 292" stroke-dasharray="4 7"/>
      </svg>
      <div class="coordinate bottom-coordinate"><span class="tiny-line"></span> โลกกำลังรอการเปลี่ยนแปลง</div>
    </div>
  </main>
  <footer class="footer"><span id="connection-status" role="status">เตรียมเข้าสู่สหัสวรรษใหม่</span><span id="version" aria-label="เวอร์ชันเกม"></span></footer>
  <noscript><p class="script-notice">กรุณาเปิด JavaScript เพื่อใช้งาน World 2000</p></noscript>
</body>
</html>
